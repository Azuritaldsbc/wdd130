<!DOCTYPE html>
<!--this is my webpage for the pool form-->
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About the pool example">
    <meta name="stylesheet" content="Abe Zurita">

    <link rel="stylesheet" href="styles/poll-form.css">
    <header>
        <main>
            <h1>Contact Information</h1>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-item label-narrow">
                        <label for="Fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item label-narrow">
                        <label for="useremail">Email</label>
                        <input type="email" id="usermail" name="usermail" required>
                    </div>
                </fieldset>
            </form>
            <form>
                <label>
                    <legend>Questions</legend>
                    <div class="form-item label-wide">
                        <label for="browser">What is your favorite Browser</label>
                        <select name="browser" id="browser">
                            <option value="Explorer">Explorer</option>
                            <option value="chrome">Chrome</option>
                            <option value="firefox">Firefox</option>
                            <option value="Safari">Safari</option>
                        </select>
                    </div>
                    <div class="form-item label-wide">
                        <label class="pet">
                            <input type="checkbox" id="pet" name="pet">
                            Do you have a household Pet</label>
                    </div>
                </label>
                <div class="form-item label-wide">
                    <label for="places">List the places you have lived:</label>
                </div>
                <div class="form-item label-wide">
                    <textarea name="places" id="places" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </div>
                </fieldset>
                <button type="submit">Submit Poll</button>
            </form>
        </main>
    </header>

<body>
    <footer>

    </footer>
</body>

</html>
