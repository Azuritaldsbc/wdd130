<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic structure example using semantic HTML elements">
    <meta name="author" content="Abraham Zurita">
    <title>Basic HTML Structure</title>
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="image of a monitor" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li>
                <a href="https://www.churchofjesuschrist org">
                    churchofjesuschrist
                </a>
            </li>
            <li>
                <a href="https://www.utah gov">
                    Utah Government
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <h1>
            Basic HTML Structure
        </h1>
        <section>
            <h2>
                Heading 1
            </h2>
            <P>
                This is an exmaple.
            </P>
        </section>
        <section>
            <h2>
                Heading 2
            </h2>
            <p>
                This is example #2
            </p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/albuquerque-new-mexico/400x640/albuquerque-temple-lds-930844-wallpaper.jpg" alt="Albuquerque Temple" width="200">
    </aside>
    <footer>
        <p>
            Abe Zurita
        </p>
    </footer>
</body>

</html>
